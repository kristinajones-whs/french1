<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Clavier Français — Dactylo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --paper: #f7f1e2;
    --paper-edge: #ece2c8;
    --grid-line: #a9c6e8;
    --grid-line-soft: rgba(122,163,214,.28);
    --margin-red: #c1443a;
    --ink: #223449;
    --ink-soft: #4c5f76;
    --ink-faint: #8291a3;
    --pencil-green: #2f6e52;
    --pencil-green-deep: #1f4d3a;
    --correct-bg: rgba(47,110,82,.16);
    --wrong: #c1443a;
    --wrong-bg: rgba(193,68,58,.14);
    --accent-gold: #c78a2d;
    --panel: #fffdf6;
    --panel-border: #e4d8b8;
    --shadow: 0 2px 0 rgba(34,52,73,.06);
    --key-face: #fffdf8;
    --key-border: #d8cca9;
    --key-text: #2c3b4e;
    --home-ring: #2f6e52;
    color-scheme: light;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #16241c;
      --paper-edge: #101c15;
      --grid-line: #2b4a3c;
      --grid-line-soft: rgba(90,150,120,.18);
      --margin-red: #e07a6c;
      --ink: #eef2e8;
      --ink-soft: #b9c7bb;
      --ink-faint: #7f9384;
      --pencil-green: #7bc39a;
      --pencil-green-deep: #a9e0bf;
      --correct-bg: rgba(123,195,154,.18);
      --wrong: #e0776a;
      --wrong-bg: rgba(224,119,106,.16);
      --accent-gold: #e0b25a;
      --panel: #1c2c22;
      --panel-border: #2e4536;
      --shadow: 0 2px 0 rgba(0,0,0,.25);
      --key-face: #22332a;
      --key-border: #3a5646;
      --key-text: #eef2e8;
      --home-ring: #7bc39a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #16241c;
    --paper-edge: #101c15;
    --grid-line: #2b4a3c;
    --grid-line-soft: rgba(90,150,120,.18);
    --margin-red: #e07a6c;
    --ink: #eef2e8;
    --ink-soft: #b9c7bb;
    --ink-faint: #7f9384;
    --pencil-green: #7bc39a;
    --pencil-green-deep: #a9e0bf;
    --correct-bg: rgba(123,195,154,.18);
    --wrong: #e0776a;
    --wrong-bg: rgba(224,119,106,.16);
    --accent-gold: #e0b25a;
    --panel: #1c2c22;
    --panel-border: #2e4536;
    --shadow: 0 2px 0 rgba(0,0,0,.25);
    --key-face: #22332a;
    --key-border: #3a5646;
    --key-text: #eef2e8;
    --home-ring: #7bc39a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--paper-edge);
  }
  body {
    font-family: "Work Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--ink);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-tap-highlight-color: transparent;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  h1, h2, h3 { font-family: "Caveat", cursive; font-weight: 700; margin: 0; }
  button { font-family: inherit; }

  .app {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; max-height: none; border-right: none; border-bottom: 1px solid var(--panel-border); }
  }

  /* ---------- Sidebar: spiral notebook tabs ---------- */
  .sidebar {
    background: var(--paper-edge);
    padding: 22px 14px 22px 18px;
    position: sticky;
    top: 0;
    top: env(safe-area-inset-top, 0px);
    height: 100vh;
    overflow-y: auto;
    border-right: 3px solid var(--panel-border);
  }
  .brand {
    display: flex; align-items: baseline; gap: 8px;
    margin-bottom: 4px;
  }
  .brand h1 { font-size: 2rem; color: var(--pencil-green-deep); line-height: 1; }
  .brand span.flag { font-size: 1.1rem; }
  .brand-sub { color: var(--ink-soft); font-size: .82rem; margin: 2px 0 18px; }

  .student-box {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .student-box label { display:block; font-size: .72rem; text-transform: none; color: var(--ink-faint); margin-bottom: 4px; }
  .student-row { display: flex; gap: 6px; }
  .student-row select, .student-row input {
    flex: 1; min-width: 0;
    font-family: inherit; font-size: .88rem;
    padding: 6px 8px; border-radius: 7px;
    border: 1px solid var(--panel-border);
    background: var(--paper); color: var(--ink);
  }
  .student-row button {
    border: 1px solid var(--panel-border);
    background: var(--pencil-green); color: #fdfaf0;
    border-radius: 7px; padding: 0 10px; cursor: pointer; font-size: .85rem;
  }
  .student-row button:hover { filter: brightness(1.06); }

  .nav-group { margin-bottom: 14px; }
  .nav-group-title {
    font-size: .86rem; color: var(--ink-soft); font-weight: 600; letter-spacing: .01em;
    padding: 7px 8px 5px; cursor: pointer; border-radius: 6px; user-select: none;
  }
  .nav-group-title:hover { background: var(--grid-line-soft); }
  .nav-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px; border-radius: 8px;
    cursor: pointer; color: var(--ink-soft);
    font-size: .92rem; border: 1px solid transparent;
    position: relative;
  }
  .nav-item:hover { background: var(--grid-line-soft); }
  .nav-item.active {
    background: var(--panel); border-color: var(--panel-border);
    color: var(--ink); box-shadow: var(--shadow);
  }
  .nav-item .stars { margin-left: auto; font-size: .78rem; color: var(--accent-gold); white-space: nowrap; }
  .nav-item.home-link { font-family:"Caveat",cursive; font-size:1.15rem; font-weight:700; color: var(--pencil-green-deep); }

  .sidebar-foot {
    margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--panel-border);
    font-size: .76rem; color: var(--ink-faint); line-height: 1.5;
  }
  .sidebar-foot button {
    display:block; width:100%; margin-top:8px; padding: 8px 10px;
    border-radius: 8px; border: 1px solid var(--panel-border);
    background: var(--panel); color: var(--ink-soft); cursor: pointer; font-size: .8rem;
  }
  .sidebar-foot button:hover { color: var(--ink); }

  /* ---------- Main page (grid paper) ---------- */
  .page-wrap { padding: clamp(16px, 3vw, 40px); }
  .page {
    max-width: 880px; margin: 0 auto;
    background:
      repeating-linear-gradient(var(--paper), var(--paper) 27px, var(--grid-line-soft) 28px),
      var(--paper);
    background-size: 100% 28px;
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    box-shadow: 0 8px 24px rgba(20,30,20,.08);
    position: relative;
    padding: 30px 26px 34px 56px;
    min-height: 70vh;
  }
  .page::before {
    content: "";
    position: absolute; left: 34px; top: 0; bottom: 0; width: 2px;
    background: var(--margin-red); opacity: .55;
  }

  /* ---------- Home dashboard ---------- */
  .dash-head h2 { font-size: 2.3rem; color: var(--pencil-green-deep); }
  .dash-head p { color: var(--ink-soft); max-width: 62ch; margin-top: 6px; line-height: 1.55; }
  .progress-strip {
    display:flex; gap: 18px; margin: 18px 0 28px; flex-wrap: wrap;
  }
  .stat-chip {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 10px 16px; box-shadow: var(--shadow);
    min-width: 120px;
  }
  .stat-chip .num { font-family:"Caveat",cursive; font-size: 1.8rem; color: var(--pencil-green-deep); line-height: 1; }
  .stat-chip .lbl { font-size: .74rem; color: var(--ink-faint); margin-top: 2px; }

  .niveau-block { margin-bottom: 30px; }
  .niveau-block h3 { font-size: 1.6rem; color: var(--ink); margin-bottom: 10px; }
  .lesson-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 10px;
  }
  .lesson-card {
    text-align: left; cursor: pointer;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 12px 13px;
    box-shadow: var(--shadow);
    transition: transform .12s ease;
  }
  .lesson-card:hover { transform: translateY(-2px); }
  .lesson-card .lt { font-weight: 600; font-size: .93rem; color: var(--ink); }
  .lesson-card .lm { font-size: .76rem; color: var(--ink-faint); margin-top: 3px; }
  .lesson-card .lstars { margin-top: 6px; font-size: .8rem; color: var(--accent-gold); }
  .lesson-card .lstars.none { color: var(--ink-faint); }

  /* ---------- Lesson view ---------- */
  .lesson-head { display:flex; align-items:flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .lesson-head h2 { font-size: 2.1rem; color: var(--pencil-green-deep); }
  .back-link {
    background: none; border: none; color: var(--ink-soft); cursor: pointer;
    font-size: .85rem; padding: 0; margin-bottom: 8px; text-decoration: underline;
  }
  .lesson-meta { color: var(--ink-faint); font-size: .84rem; margin-top: 2px;}
  .lesson-note { color: var(--ink-soft); font-size: .8rem; font-style: italic; margin-top: 6px; max-width: 52ch; line-height: 1.45; }

  .live-stats { display:flex; gap: 22px; margin: 4px 0 20px; }
  .live-stats .s { text-align:center; }
  .live-stats .v { font-family:"Caveat",cursive; font-size: 2.1rem; color: var(--pencil-green-deep); line-height:1; }
  .live-stats .k { font-size: .7rem; color: var(--ink-faint); }

  .prompt-box {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 22px 24px; box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .prompt-fr {
    font-family: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: clamp(1.4rem, 4vw, 2rem);
    letter-spacing: .02em;
    line-height: 1.5;
    word-break: break-word;
  }
  .prompt-fr .ch { border-bottom: 2px solid transparent; padding-bottom: 1px; }
  .prompt-fr .ch.pending { color: var(--ink-faint); }
  .prompt-fr .ch.correct { color: var(--pencil-green); background: var(--correct-bg); border-radius: 3px; }
  .prompt-fr .ch.wrong { color: var(--wrong); background: var(--wrong-bg); border-radius: 3px; }
  .prompt-fr .ch.current { border-bottom-color: var(--pencil-green); }
  .prompt-en { color: var(--ink-soft); font-size: 1rem; margin-top: 10px; font-style: italic; }
  .prompt-hint { color: var(--ink-faint); font-size: .78rem; margin-top: 12px; }

  #typeInput {
    position: absolute; opacity: 0; height: 1px; width: 1px; pointer-events: none;
  }

  .lesson-controls { display:flex; gap: 10px; align-items:center; flex-wrap: wrap; margin-bottom: 22px; }
  .lesson-controls button, .lesson-controls label {
    font-size: .82rem; color: var(--ink-soft);
  }
  .btn {
    background: var(--pencil-green); color: #fdfaf0; border: none;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: .85rem;
  }
  .btn:hover { filter: brightness(1.07); }
  .btn.ghost {
    background: var(--panel); color: var(--ink-soft); border: 1px solid var(--panel-border);
  }
  .toggle-row { display:flex; align-items:center; gap:6px; }

  .item-dots { display:flex; gap:5px; flex-wrap:wrap; margin-bottom: 16px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--panel-border); }
  .dot.done { background: var(--pencil-green); }
  .dot.now { background: var(--accent-gold); }

  /* ---------- Keyboard ---------- */
  .keyboard-wrap { margin-top: 0; margin-bottom: 20px; }
  .keyboard {
    display: flex; flex-direction: column; gap: 6px;
    background: var(--paper-edge); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 12px; max-width: 660px;
  }
  .krow { display:flex; gap: 6px; justify-content: center; }
  .key {
    background: var(--key-face); border: 1px solid var(--key-border);
    color: var(--key-text);
    border-radius: 7px; height: 42px; min-width: 38px;
    display:flex; align-items:center; justify-content:center;
    font-size: .9rem; font-weight: 500; position: relative;
    box-shadow: 0 2px 0 rgba(0,0,0,.09);
  }
  .key.w15 { min-width: 54px; }
  .key.w20 { min-width: 68px; font-size: .74rem; }
  .key.wspace { flex: 1; max-width: 320px; }
  .key.home::after {
    content:""; position:absolute; bottom: 6px; left:50%; transform: translateX(-50%);
    width: 13px; height: 3px; border-radius: 3px; background: var(--home-ring); opacity:.85;
  }
  .key[data-key="f"]::after, .key[data-key="j"]::after {
    width: 16px; height: 3px; opacity: 1;
  }
  .key.active {
    outline: 3px solid var(--pencil-green); outline-offset: 1px;
    background: var(--correct-bg);
  }
  .key.shifted { outline: 3px dashed var(--accent-gold); outline-offset: 1px; }
  .home-callout {
    display:flex; gap: 12px; align-items:flex-start;
    background: var(--correct-bg); border: 1px solid var(--pencil-green);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 14px;
    font-size: .92rem; color: var(--ink); line-height: 1.55;
  }
  .home-callout .icon { font-size: 1.6rem; line-height: 1; }
  .key-badge {
    display:inline-flex; align-items:center; justify-content:center;
    min-width: 22px; height: 22px; padding: 0 5px;
    background: var(--key-face); border: 1px solid var(--key-border);
    border-radius: 5px; font-family:"JetBrains Mono", monospace; font-size: .82rem;
    color: var(--key-text); margin: 0 1px;
  }
  .finger-legend { display:flex; gap: 10px; flex-wrap:wrap; margin-top: 10px; font-size: .72rem; color: var(--ink-faint); }
  .finger-legend .sw { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:middle; }

  .key.f-lp { background: color-mix(in srgb, var(--key-face) 70%, #d98a8a); }
  .key.f-lr { background: color-mix(in srgb, var(--key-face) 70%, #d9b98a); }
  .key.f-lm { background: color-mix(in srgb, var(--key-face) 70%, #d9d08a); }
  .key.f-li { background: color-mix(in srgb, var(--key-face) 70%, #a9d98a); }
  .key.f-ri { background: color-mix(in srgb, var(--key-face) 70%, #8ad9c9); }
  .key.f-rm { background: color-mix(in srgb, var(--key-face) 70%, #8ab0d9); }
  .key.f-rr { background: color-mix(in srgb, var(--key-face) 70%, #b28ad9); }
  .key.f-rp { background: color-mix(in srgb, var(--key-face) 70%, #d98ac2); }
  .key.f-th { background: var(--key-face); }

  .completion-banner {
    display:none; background: var(--panel); border: 2px solid var(--pencil-green);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; box-shadow: var(--shadow);
  }
  .completion-banner.show { display:block; animation: stamp .28s ease; }
  @keyframes stamp { 0% { transform: scale(1.15) rotate(-2deg); opacity:0; } 100% { transform: scale(1) rotate(0); opacity:1; } }
  .completion-banner h3 { color: var(--pencil-green-deep); font-size: 1.7rem; }
  .completion-banner .stampline { font-size: .88rem; color: var(--ink-soft); margin-top: 4px; }

  .teacher-note {
    margin-top: 34px; padding-top: 16px; border-top: 1px dashed var(--panel-border);
    font-size: .78rem; color: var(--ink-faint); line-height: 1.6; max-width: 60ch;
  }

  /* ---------- Technique: intro card, hands guide, blind mode ---------- */
  .tech-intro {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-left: 4px solid var(--accent-gold);
    border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .tech-intro .ti-title { font-family: "Caveat", cursive; font-size: 1.35rem; color: var(--pencil-green-deep); line-height: 1.1; }
  .tech-intro .ti-keys { margin: 6px 0 2px; display: flex; gap: 4px; flex-wrap: wrap; }
  .tech-intro .ti-keys .key-badge { min-width: 30px; height: 30px; font-size: 1rem; box-shadow: inset 0 0 0 2px var(--accent-gold); }
  .tech-intro .ti-tip { font-size: .88rem; color: var(--ink-soft); line-height: 1.55; margin-top: 6px; }

  .callout-details { margin-bottom: 12px; }
  .callout-details summary {
    cursor: pointer; font-size: .88rem; color: var(--pencil-green-deep); font-weight: 600; padding: 4px 0;
  }
  .callout-details .home-callout { margin-top: 8px; margin-bottom: 0; }
  .lesson-head .live-stats { margin: 0; }

  .key.newkey { box-shadow: inset 0 0 0 2px var(--accent-gold), 0 2px 0 rgba(0,0,0,.09); }
  .keyboard.blind .key { color: transparent; }

  .hands-wrap { margin: 0 0 14px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .hands-guide {
    flex: 1 1 280px; font-size: .92rem; color: var(--ink); line-height: 1.5; margin: 0;
  }
  .hands-guide .en { display: block; color: var(--ink-faint); font-size: .8rem; margin-top: 2px; }
  .hands-guide .bad { color: var(--wrong); }
  svg.hands { flex: 0 1 440px; width: 440px; max-width: 100%; height: auto; display: block; }
  .posture-card svg.hands { width: 100%; max-width: 560px; flex: none; }
  .hands .palm { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1.5; }
  .fing { transition: transform .2s ease, opacity .2s ease; }
  .fing rect, .fing ellipse {
    fill: color-mix(in srgb, var(--key-face) 62%, var(--fc, #ccc));
    stroke: var(--key-border); stroke-width: 1.5;
  }
  .fing.f-lp { --fc: #d98a8a; } .fing.f-rp { --fc: #d98ac2; }
  .fing.f-lr { --fc: #d9b98a; } .fing.f-rr { --fc: #b28ad9; }
  .fing.f-lm { --fc: #d9d08a; } .fing.f-rm { --fc: #8ab0d9; }
  .fing.f-li { --fc: #a9d98a; } .fing.f-ri { --fc: #8ad9c9; }
  .fing text { font-family: "JetBrains Mono", monospace; font-size: 19px; font-weight: 700; fill: var(--key-text); text-anchor: middle; pointer-events: none; }
  .fing text.thumb-label { font-size: 11px; font-weight: 500; }
  .fing .bump { fill: var(--home-ring); }
  .fing.on rect, .fing.on ellipse { stroke: var(--pencil-green); stroke-width: 4; }
  .fing.on2 rect { stroke: var(--accent-gold); stroke-width: 3; stroke-dasharray: 5 3; }
  .hands.has-active .fing:not(.on):not(.on2) { opacity: .5; }
  .hands .hand-label { font-family: "Work Sans", sans-serif; font-size: 12px; fill: var(--ink-faint); text-anchor: middle; }

  .posture-card {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    padding: 12px 18px; margin: 18px 0 8px; box-shadow: var(--shadow); max-width: 640px;
  }
  .posture-card summary { cursor: pointer; font-family: "Caveat", cursive; font-size: 1.45rem; font-weight: 700; color: var(--pencil-green-deep); }
  .posture-card ul { margin: 10px 0 4px; padding-left: 20px; font-size: .88rem; line-height: 1.65; color: var(--ink-soft); }
  .posture-card ul span.en { color: var(--ink-faint); }
  .posture-card .posture-hands { margin-top: 10px; }

  @media (prefers-reduced-motion: reduce) {
    .completion-banner.show, .lesson-card { animation: none !important; transition: none !important; }
    .fing { transition: none !important; }
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 6px; }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="page-wrap"><div class="page" id="page"></div></main>
</div>
<input id="typeInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />

<script>
/* ============================= DATA ============================= */
const H = (hint, arr) => arr.map(d => [d, hint]);
const NIVEAUX = [
  { id:'tech', label:'Technique : apprendre les doigts', lessons:[
    { id:'tech-fj', technique:true, title:'Étape 1 · F et J (index)', icon:'☝️', newKeys:['f','j'],

const FINGER_NAMES = { lp:'left pinky', lr:'left ring', lm:'left middle', li:'left index', ri:'right index', rm:'right middle', rr:'right ring', rp:'right pinky', th:'thumbs' };
const LEFT_FINGERS = new Set(['lp','lr','lm','li']);
const ACCENT_MAP = { 'à':'a','â':'a','ä':'a','é':'e','è':'e','ê':'e','ë':'e','î':'i','ï':'i','ô':'o','ö':'o','ù':'u','û':'u','ü':'u','ç':'c','œ':'o','\u2019':'\'' };

function baseKeyFor(ch){
  const lower = ch.toLowerCase();
  return ACCENT_MAP[lower] || lower;
}

function buildKeyboard(){
  const wrap = document.createElement('div');
  wrap.className = 'keyboard';
  ROWS.forEach(row=>{
    const r = document.createElement('div'); r.className='krow';
    row.forEach(([k,f,home])=>{
      const b = document.createElement('div');
      b.className = 'key f-'+f + (home ? ' home' : '');
      b.dataset.key = k;
      b.dataset.finger = f;
      b.textContent = k;
      r.appendChild(b);
    });
    wrap.appendChild(r);
  });
  const spaceRow = document.createElement('div'); spaceRow.className='krow';
  const lshift = document.createElement('div'); lshift.className='key w20 f-lp'; lshift.textContent='shift'; lshift.dataset.key='shiftL'; lshift.dataset.finger='lp';
  const space = document.createElement('div'); space.className='key wspace f-th'; space.textContent='espace'; space.dataset.key=' '; space.dataset.finger='th';
  const rshift = document.createElement('div'); rshift.className='key w20 f-rp'; rshift.textContent='shift'; rshift.dataset.key='shiftR'; rshift.dataset.finger='rp';
  spaceRow.appendChild(lshift); spaceRow.appendChild(space); spaceRow.appendChild(rshift);
  wrap.appendChild(spaceRow);
  return wrap;
}

function highlightKeyboard(kbEl, nextChar){
  kbEl.querySelectorAll('.key').forEach(k=>{ k.classList.remove('active','shifted'); });
  if (nextChar === undefined) return;
  const base = baseKeyFor(nextChar);
  const needsShift = nextChar !== nextChar.toLowerCase() && nextChar === nextChar.toUpperCase() && /[a-zà-ÿ]/i.test(nextChar) && base !== nextChar.toLowerCase() ? false : (nextChar >= 'A' && nextChar <= 'Z');
  const target = kbEl.querySelector('.key[data-key="'+CSS.escape(base)+'"]');
  if (target) {
    target.classList.add('active');
    if (needsShift){
      const finger = target.dataset.finger;
      const shiftKey = LEFT_FINGERS.has(finger) ? 'shiftR' : 'shiftL';
      const shiftEl = kbEl.querySelector('.key[data-key="'+shiftKey+'"]');
      if (shiftEl) shiftEl.classList.add('shifted');
    }
  } else if (base === ' ') {
    const sp = kbEl.querySelector('.key[data-key=" "]');
    if (sp) sp.classList.add('active');
  }
}

    svg.appendChild(g);
  });
  const l1 = svgEl('text', { class:'hand-label', x:112, y:131 }); l1.textContent = 'main gauche';
  const l2 = svgEl('text', { class:'hand-label', x:488, y:131 }); l2.textContent = 'main droite';
  svg.appendChild(l1); svg.appendChild(l2);
  return svg;
}

function setHands(svg, info){
  svg.querySelectorAll('.fing').forEach(g => { g.classList.remove('on','on2'); g.style.transform = ''; });
  svg.classList.toggle('has-active', !!info);
  if (!info) return;
  info.fingers.forEach(f => {
    svg.querySelectorAll('.fing.f-' + f).forEach(g => {
      g.classList.add('on');
      g.style.transform = 'translate(' + info.dx + 'px,' + info.dy + 'px)';
    });
  });
  (info.shiftFingers || []).forEach(f => {
    svg.querySelectorAll('.fing.f-' + f).forEach(g => g.classList.add('on2'));
  });
}

function keyInfo(ch){
  if (ch === ' ') return { key:' ', finger:'th', row:4, inner:false, shift:false, accent:false, dx:0, dy:6 };
  const shift = ch.length === 1 && ch >= 'A' && ch <= 'Z';
  const accent = /[àâäéèêëîïôöùûüçœ]/i.test(ch);
  const base = baseKeyFor(ch);
  for (let r = 0; r < ROWS.length; r++){
    for (const entry of ROWS[r]){
      if (entry[0] === base){
        const inner = INNER_KEYS.has(base);
        const dx = inner ? (entry[1] === 'li' ? 14 : -14) : 0;
        return { key:base, finger:entry[1], row:r, inner, shift, accent, dx, dy:(r - 2) * 14 };
      }
    }
  }
  return null;
}

function guideFor(ch){
  const ki = keyInfo(ch);
  if (!ki) return { html:'Tape <span class="key-badge">' + escapeHtml(ch) + '</span>', info:null };
  const fl = FINGER_LABEL[ki.finger];
  const keyLabel = ki.key === ' ' ? 'espace' : ki.key.toUpperCase();
  let fr, en;
  if (ki.key === ' '){
    fr = 'barre d’espace : un pouce, les autres doigts ne bougent pas';
    en = 'space bar: either thumb, the other fingers stay put';
  } else {
    const home = HOME_KEY_OF[ki.finger];
    const vFR = ki.row === 0 ? 'monte de deux rangées' : ki.row === 1 ? 'monte d’une rangée' : ki.row === 3 ? 'descends d’une rangée' : '';
    const vEN = ki.row === 0 ? 'reach up two rows' : ki.row === 1 ? 'reach up one row' : ki.row === 3 ? 'reach down one row' : '';
    const sFR = ki.inner ? 'étire-toi vers le centre' : '';
    const sEN = ki.inner ? 'stretch toward the middle' : '';
    const pFR = [vFR, sFR].filter(Boolean), pEN = [vEN, sEN].filter(Boolean);
    if (pFR.length){
      fr = pFR.join(' et ') + ', puis reviens sur <strong>' + home + '</strong>';
      en = pEN.join(' and ') + ', then return to ' + home;
    } else if (ki.key === "'") {
      fr = 'étire l’auriculaire vers la droite, juste après <strong>;</strong>, puis reviens sur <strong>;</strong>';
      en = 'stretch the pinky one key right of ;, then return';
    } else {
      fr = 'c’est une touche de la rangée de départ, les doigts restent en place';
      en = 'a home-row key, fingers stay in place';
    }
  }
  const shiftFingers = [];
  let shiftFR = '', shiftEN = '';
  if (ki.shift){
    shiftFingers.push(LEFT_FINGERS.has(ki.finger) ? 'rp' : 'lp');
    shiftFR = '<strong>Majuscule :</strong> maintiens <strong>Shift</strong> avec l’auriculaire de l’autre main. ';
    shiftEN = 'Capital: hold Shift with the other pinky. ';
  }
  const html = shiftFR + 'Tape <span class="key-badge">' + escapeHtml(keyLabel) + '</span> avec <strong>' + fl[0] + '</strong> : ' + fr + '.'
    + (ki.accent ? ' <em>(accent facultatif)</em>' : '')
    + '<span class="en">' + shiftEN + keyLabel + ' → ' + fl[1] + ': ' + en + '.</span>';
  return { html, info:{ fingers:[ki.finger], dx:ki.dx, dy:ki.dy, shiftFingers } };
}

/* ============================= STORAGE ============================= */
const STORE_KEY = 'ftt_students_v1';
function loadStore(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveStore(store){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){}
}
let store = loadStore();
let currentStudent = localStorage.getItem('ftt_current_student') || '';

function ensureStudent(name){
  if (!store[name]) store[name] = { lessons: {} };
  return store[name];
}
function recordResult(lessonId, wpm, accuracy){
  if (!currentStudent) return;
  const s = ensureStudent(currentStudent);
  const prev = s.lessons[lessonId];
  const best = prev ? Math.max(prev.bestWpm||0, wpm) : wpm;
  const bestAcc = prev ? Math.max(prev.bestAccuracy||0, accuracy) : accuracy;
  s.lessons[lessonId] = {
    bestWpm: Math.round(best*10)/10,
    bestAccuracy: Math.round(bestAcc*10)/10,
    lastWpm: Math.round(wpm*10)/10,
    lastAccuracy: Math.round(accuracy*10)/10,
    plays: (prev?.plays||0) + 1,
    lastPlayed: new Date().toISOString()
  };
  saveStore(store);
}
function starsFor(lessonId){
  const s = store[currentStudent];
  if (!s || !s.lessons[lessonId]) return 0;
  const acc = s.lessons[lessonId].bestAccuracy;
  if (acc >= 97) return 3;
  if (acc >= 90) return 2;
  if (acc >= 75) return 1;
  return 0;
}

async function exportResults(){
  if (!currentStudent || !store[currentStudent]){
    alert('Choisis ou ajoute d\u2019abord ton prénom dans la barre de gauche.');
    return;
  }
  const rows = [['Élève','Leçon','Meilleur MPM','Meilleure précision (%)','Dernier MPM','Dernière précision (%)','Essais','Dernière session']];
  const s = store[currentStudent];
  allLessons().forEach(l=>{

    if (!r) return;
    rows.push([currentStudent, l.title, r.bestWpm, r.bestAccuracy, r.lastWpm, r.lastAccuracy, r.plays, r.lastPlayed]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const filename = `${currentStudent.replace(/\s+/g,'_')}_progres.csv`;
  try {
    const downloads = await claude.use('downloads');
    if (downloads) {
      await downloads.save({ filename, data: csv });
      return;
    }
  } catch(e) {}
  // fallback: open a data URL the student can save manually
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function normalizeCompare(s, stripAccents){
  const caseSensitive = !!(lessonState && lessonState.lesson && lessonState.lesson.caseSensitive);
  let out = s.normalize('NFC');
  if (!caseSensitive) out = out.toLowerCase();
  out = out.trim();
  // treat straight and curly apostrophes as the same character, since a physical
  // keyboard can only type a straight apostrophe (') but French elisions display as '
  out = out.replace(/[\u2018\u2019\u02BC\u02BB`]/g, "'");
  if (stripAccents) out = out.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return out;
}

// What the student actually has to type for an item. On a US keyboard, œ / æ can't be typed,
// so in the default (lenient) mode they are expected as "oe" / "ae" instead.
function targetFor(item){

  if (lessonState && lessonState.strictAccents) return t;
  return t.replace(/œ/g,'oe').replace(/Œ/g,'Oe').replace(/æ/g,'ae').replace(/Æ/g,'Ae');
}

function buildDots(){
  const dotsEl = document.getElementById('itemDots');
  if (!dotsEl) return;
  dotsEl.innerHTML = lessonState.lesson.items.map((_,i)=>{
    let cls = 'dot';
    if (i < lessonState.index) cls += ' done';
    else if (i === lessonState.index) cls += ' now';
    return `<span class="${cls}"></span>`;
  }).join('');
}

function wordMatches(val, target){
  return lessonState.strictAccents
    ? normalizeCompare(val, false) === normalizeCompare(target, false)
    : normalizeCompare(val, true) === normalizeCompare(target, true);
}

function refreshLessonUI(){
  buildDots();
  const item = lessonState.lesson.items[lessonState.index];
  const promptFr = document.getElementById('promptFr');
  const promptEn = document.getElementById('promptEn');
  if (!item){ return; }
  const target = targetFor(item);
  const typed = lessonState.typed;
  let html = '';
  let hasWrong = false;
  for (let i=0; i<target.length; i++){
    const ch = target[i];
    let cls = 'ch pending';
    if (i < typed.length){
      const tCh = typed[i];
      const match = lessonState.strictAccents
        ? normalizeCompare(tCh,false) === normalizeCompare(ch,false)
        : normalizeCompare(tCh,true) === normalizeCompare(ch,true);
      if (!match) hasWrong = true;
      cls = 'ch ' + (match ? 'correct' : 'wrong');
    } else if (i === typed.length){
      cls = 'ch pending current';
    }
    html += `<span class="${cls}">${ch === ' ' ? '&nbsp;' : escapeHtml(ch)}</span>`;
  }
  promptFr.innerHTML = html;
  promptEn.textContent = item[1] + (target !== item[0] ? '  ·  orthographe : ' + item[0] : '');

  document.getElementById('statProg').textContent = `${lessonState.index+1}/${lessonState.lesson.items.length}`;
  updateLiveStats();

  const complete = wordMatches(typed, target);
  const stuck = !complete && (hasWrong || typed.length >= target.length);

  let guideHtml = '';
  let handsInfo = null;
  let nextChar;
  if (!lessonState.showHints){
    guideHtml = 'Mode sans indices : fais confiance à tes doigts !<span class="en">No-hints mode: trust your fingers.</span>';
  } else if (complete){
    handsInfo = { fingers:['li','ri'], dx:0, dy:0 };
    guideHtml = '<strong>Bien !</strong> Ramène tes <strong>index</strong> sur <span class="key-badge">F</span> et <span class="key-badge">J</span>.'
      + '<span class="en">Nice. Bring both index fingers back to F and J.</span>';
  } else if (stuck){
    guideHtml = '<span class="bad"><strong>Une lettre est fausse.</strong> Appuie sur ← (retour arrière) pour l’effacer, puis corrige.</span>'
      + '<span class="en">A letter is wrong. Press Backspace to erase it, then try again.</span>';
  } else {
    nextChar = target[typed.length];
    const g = guideFor(nextChar);
    guideHtml = g.html;
    handsInfo = g.info;
  }

  const guideEl = document.getElementById('handsGuide');
  if (guideEl) guideEl.innerHTML = guideHtml;
  const handsSvg = document.querySelector('#handsWrap svg.hands');
  if (handsSvg) setHands(handsSvg, handsInfo);

  const kbWrap = document.getElementById('kbWrap');
  const kbEl = kbWrap ? kbWrap.querySelector('.keyboard') : null;
  if (kbEl){
    highlightKeyboard(kbEl, undefined);
    if (lessonState.showHints){
      if (complete){
        kbEl.querySelectorAll('.key[data-key="f"], .key[data-key="j"]').forEach(k => k.classList.add('active'));
      } else if (nextChar !== undefined){
        highlightKeyboard(kbEl, nextChar);
      }
    }
  }
}

function updateLiveStats(){
  const wpmEl = document.getElementById('statWpm');
  const accEl = document.getElementById('statAcc');
  if (!wpmEl) return;
  let wpm = 0;
  if (lessonState.startTime){
    const mins = (Date.now() - lessonState.startTime) / 60000;
    wpm = mins > 0 ? (lessonState.correctCharsTyped/5) / mins : 0;
  }
  const acc = lessonState.totalKeystrokes > 0
    ? 100 * (1 - lessonState.errorKeystrokes / lessonState.totalKeystrokes)
    : 100;
  wpmEl.textContent = Math.max(0, Math.round(wpm));
  accEl.textContent = Math.max(0, Math.round(acc)) + '%';
}

function advanceItem(skipped){
  const banner = document.getElementById('completionBanner');
  lessonState.index += 1;
  lessonState.typed = '';
  lessonState.advancing = false;
  typeInput.value = '';
  if (lessonState.index >= lessonState.lesson.items.length){
    finishLesson();
    return;
  }
  refreshLessonUI();
}

function finishLesson(){
  const mins = lessonState.startTime ? (Date.now() - lessonState.startTime) / 60000 : 0;
  const wpm = mins > 0 ? (lessonState.correctCharsTyped/5) / mins : 0;
  const acc = lessonState.totalKeystrokes > 0
    ? 100 * (1 - lessonState.errorKeystrokes / lessonState.totalKeystrokes)
    : 100;
  recordResult(lessonState.lesson.id, wpm, acc);

  const dotsEl = document.getElementById('itemDots');
  if (dotsEl) dotsEl.querySelectorAll('.dot').forEach(d=>d.classList.add('done'));
  const promptBox = document.getElementById('promptBox');
  if (promptBox) promptBox.style.display = 'none';
  const banner = document.getElementById('completionBanner');
  if (banner){
    banner.classList.add('show');
    document.getElementById('completionStats').textContent =
      `${Math.round(wpm)} mots/min · ${Math.round(acc)}% de précision — enregistré pour ${currentStudent || '(choisis ton prénom à gauche)'}.`;
  }
  document.getElementById('statProg').textContent = `${lessonState.lesson.items.length}/${lessonState.lesson.items.length}`;
  renderSidebar();
}

typeInput.addEventListener('input', (e)=>{
  if (!lessonState) return;
  if (!lessonState.startTime) lessonState.startTime = Date.now();

  const val = e.target.value;
  const target = currentTarget();

  if (val.length > lessonState.typed.length){
    const idx = val.length - 1;
    const typedCh = val[idx];
    const targetCh = target[idx];
    lessonState.totalKeystrokes += 1;
    if (targetCh !== undefined){
      const match = lessonState.strictAccents
        ? normalizeCompare(typedCh,false) === normalizeCompare(targetCh,false)
        : normalizeCompare(typedCh,true) === normalizeCompare(targetCh,true);
      if (match) lessonState.correctCharsTyped += 1;
      else lessonState.errorKeystrokes += 1;
    } else {
      lessonState.errorKeystrokes += 1;
    }
  }
  lessonState.typed = val;
  refreshLessonUI();

  const doneMatch = wordMatches(val, target);
  if (doneMatch && !lessonState.advancing){
    lessonState.advancing = true;
    const ls = lessonState;
    const delay = ls.lesson.technique ? 700 : 260;
    setTimeout(()=>{
      if (lessonState !== ls) return;   // student left the lesson meanwhile
      advanceItem(false);
    }, delay);
  }
});

/* ============================= RENDER ROOT ============================= */
function render(){
  renderSidebar();
  if (route.view === 'lesson'){
    renderLesson(route.lessonId);
  } else {
    lessonState = null;
    renderHome();
  }
}

render();
</script>
